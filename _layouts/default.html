<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Zen Kaku Gothic New', sans-serif; background: #0a0a12; color: #e9e6f7; overflow-x: hidden; }
a { text-decoration: none; color: inherit; }
::selection { background: #a855f7; color: #fff; }

.bg-glow { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(600px 300px at 15% 0%, rgba(168,85,247,.18), transparent 60%),
    radial-gradient(700px 400px at 90% 15%, rgba(255,45,149,.12), transparent 60%),
    radial-gradient(600px 400px at 50% 100%, rgba(34,211,238,.08), transparent 60%);
}
.wrap { position: relative; z-index: 1; }

header { position: sticky; top: 0; z-index: 10; background: rgba(10,10,18,.85); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(168,85,247,.5); box-shadow: 0 0 18px rgba(168,85,247,.25); }
.nav { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-img { height: 42px; width: auto; display: block; }
.logo-text { font-family: 'DotGothic16', sans-serif; font-size: 1.6em; letter-spacing: 2px; display: none; }
.logo-text a { color: inherit; }
.logo-text .pick { color: #c084fc; }
.logo-text .ies { color: #ff2d95; }
.logo-text .pick, .logo-text .ies { text-shadow: 0 0 8px currentColor, 0 0 24px currentColor; }
.nav-links { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.nav-links a { padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: .9em; color: #b9b3dc; transition: .2s; }
.nav-links a:hover { color: #fff; text-shadow: 0 0 10px #a855f7; background: rgba(168,85,247,.12); }
.nav-links a.discord-btn { background: rgba(88,101,242,.18); border: 1px solid #5865F2; color: #b9bfff; box-shadow: 0 0 14px rgba(88,101,242,.4); }
.nav-links a.discord-btn:hover { background: rgba(88,101,242,.35); color: #fff; }

.wrap > section, .wrap > .hero { max-width: 1100px; margin: 0 auto; }
.hero { max-width: 1100px; margin: 0 auto; padding: 80px 20px 56px; text-align: center; }
.hero-badge { display: inline-block; border: 1px solid rgba(168,85,247,.7); color: #d8b4fe; border-radius: 999px; padding: 6px 16px; font-size: .9em; background: rgba(168,85,247,.08); box-shadow: 0 0 16px rgba(168,85,247,.25) inset; margin-bottom: 20px; letter-spacing: 1px; }
.hero h1 { font-family: 'DotGothic16', sans-serif; font-size: clamp(2.4em, 7vw, 4.4em); font-weight: 400; line-height: 1.3; color: #fff; text-shadow: 0 0 8px rgba(168,85,247,.95), 0 0 28px rgba(168,85,247,.6), 0 0 64px rgba(168,85,247,.4); margin-bottom: 18px; }
.hero h1 .accent { color: #ff2d95; text-shadow: 0 0 8px rgba(255,45,149,.95), 0 0 28px rgba(255,45,149,.6), 0 0 64px rgba(255,45,149,.4); }
.hero p { font-size: 1.05em; color: #a8a3c8; max-width: 560px; margin: 0 auto 32px; line-height: 1.9; }
.hero-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.btn { display: inline-block; padding: 14px 30px; border-radius: 999px; font-weight: 700; transition: .25s; }
.btn-primary { background: linear-gradient(135deg, #7c3aed, #ff2d95); color: #fff; box-shadow: 0 0 20px rgba(168,85,247,.6), 0 0 44px rgba(255,45,149,.35); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 28px rgba(168,85,247,.85), 0 0 64px rgba(255,45,149,.5); }
.btn-ghost { background: rgba(10,10,18,.6); border: 1px solid #a855f7; color: #d8b4fe; box-shadow: 0 0 12px rgba(168,85,247,.3) inset, 0 0 16px rgba(168,85,247,.2); }
.btn-ghost:hover { background: rgba(168,85,247,.15); color: #fff; }
.hero-emoji { font-size: 2.6em; margin-top: 26px; letter-spacing: 10px; filter: drop-shadow(0 0 10px rgba(168,85,247,.7)); }

section { max-width: 1100px; margin: 0 auto; padding: 56px 20px; }
.section-title { font-family: 'DotGothic16', sans-serif; font-size: 1.7em; margin-bottom: 8px; color: #fff; }
.section-title .g { color: #c084fc; text-shadow: 0 0 10px #a855f7; }
.section-sub { color: #8d88ad; margin-bottom: 26px; font-size: .95em; }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.cat-card { background: rgba(20,18,34,.85); border: 1px solid rgba(168,85,247,.45); border-radius: 18px; padding: 24px 20px; text-align: center; transition: .25s; }
.cat-card:hover { transform: translateY(-4px); border-color: #ff2d95; box-shadow: 0 0 22px rgba(255,45,149,.35); }
.cat-icon { font-size: 2.4em; display: block; margin-bottom: 12px; filter: drop-shadow(0 0 8px rgba(168,85,247,.8)); }
.cat-card h3 { font-family: 'DotGothic16', sans-serif; font-size: 1.05em; letter-spacing: 2px; margin-bottom: 8px; color: #e9e0ff; }
.cat-card p { font-size: .84em; color: #9a94bd; line-height: 1.7; }

.blog-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.blog-card { background: rgba(20,18,34,.85); border-radius: 16px; overflow: hidden; border: 1px solid rgba(168,85,247,.4); transition: .25s; }
.blog-card:hover { transform: translateY(-4px); border-color: #c084fc; box-shadow: 0 0 26px rgba(168,85,247,.35); }
.blog-thumb { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 2.4em; }
.thumb-1 { background: radial-gradient(circle at 50% 30%, rgba(168,85,247,.4), rgba(20,18,34,.9) 70%); }
.thumb-2 { background: radial-gradient(circle at 50% 30%, rgba(255,45,149,.4), rgba(20,18,34,.9) 70%); }
.thumb-3 { background: radial-gradient(circle at 50% 30%, rgba(34,211,238,.35), rgba(20,18,34,.9) 70%); }
.blog-body { padding: 16px; }
.blog-cat { font-size: .72em; font-weight: 700; padding: 4px 12px; border-radius: 999px; border: 1px solid; letter-spacing: .5px; }
.c-code { color: #c4b5fd; border-color: #a855f7; background: rgba(168,85,247,.12); }
.c-game { color: #fbc7e4; border-color: #ff2d95; background: rgba(255,45,149,.12); }
.c-art  { color: #fde3c3; border-color: #ff953e; background: rgba(255,149,62,.12); }
.c-music{ color: #b9f2dd; border-color: #34d399; background: rgba(52,211,153,.12); }
.blog-body h4 { margin: 10px 0 8px; font-size: 1.02em; line-height: 1.6; color: #f1efff; }
.blog-body h4 a:hover { color: #c084fc; }
.blog-meta { font-size: .78em; color: #7d78a3; }
.more-link { display: inline-block; margin-top: 22px; font-weight: 700; color: #c084fc; text-shadow: 0 0 10px rgba(168,85,247,.6); }
.more-link:hover { color: #fff; }

.yt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.yt-card { background: rgba(20,18,34,.85); border-radius: 14px; overflow: hidden; border: 1px solid rgba(168,85,247,.35); transition: .25s; display: block; }
.yt-card:hover { transform: translateY(-4px); border-color: #ff2d95; box-shadow: 0 0 22px rgba(255,45,149,.3); }
.yt-thumb { height: 96px; display: flex; align-items: center; justify-content: center; font-size: 2em; background: radial-gradient(circle at 50% 40%, rgba(168,85,247,.3), rgba(12,10,20,.9) 75%); }
.yt-card .info { padding: 12px; }
.yt-card .info h4 { font-size: .84em; font-weight: 700; line-height: 1.6; color: #eae6ff; }
.yt-card .info p { font-size: .74em; color: #78729c; margin-top: 4px; }
.yt-play { display: inline-block; color: #ff4d4d; filter: drop-shadow(0 0 8px rgba(255,77,77,.8)); }

.discord-cta { background: linear-gradient(135deg, rgba(88,101,242,.25), rgba(168,85,247,.2)); border: 1px solid #5865F2; color: #fff; border-radius: 24px; padding: 46px 24px; text-align: center; box-shadow: 0 0 40px rgba(88,101,242,.35), inset 0 0 40px rgba(124,58,237,.08); }
.discord-cta h2 { font-family: 'DotGothic16', sans-serif; font-size: 1.6em; letter-spacing: 1px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(136,149,255,.8), 0 0 30px rgba(88,101,242,.5); }
.discord-cta p { opacity: .92; margin-bottom: 22px; line-height: 1.9; color: #dcdcff; }
.btn-white { background: #fff; color: #5865F2; display: inline-block; padding: 14px 32px; border-radius: 999px; font-weight: 800; box-shadow: 0 0 18px rgba(255,255,255,.35); }
.btn-white:hover { transform: translateY(-2px); box-shadow: 0 0 28px rgba(255,255,255,.55); }

footer { max-width: 1100px; margin: 0 auto; padding: 34px 20px 60px; text-align: center; color: #565174; font-size: .85em; letter-spacing: .5px; border-top: 1px solid rgba(168,85,247,.2); }

@media (max-width: 640px) {
  .nav { flex-direction: column; }
  section { padding: 40px 16px; }
  .hero { padding: 48px 16px; }
}
.wrap img:not(.logo-img) {
  max-width: min(100%, 600px);
  height: auto;
  border-radius: 12px;
  display: block;
  margin: 0 auto;
}
  /* 記事本文の余白調整 */
.wrap > h1, .wrap > h2, .wrap > h3, .wrap > p, .wrap > ul, .wrap > ol {
  max-width: 720px;
  margin-left: auto;
  margin-right: auto;
  padding-left: 24px;
  padding-right: 24px;
}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">

<header>
  <div class="nav">
    <div class="logo">
      {% if site.logo-img %}
      <a href="{{ '/' | relative_url }}"><img src="{{ site.logo-img }}" alt="Pickies" class="logo-img"></a>
      {% else %}
      <div class="logo-text"><a href="{{ '/' | relative_url }}"><span class="pick">Pickie</span><span class="ies">s</span></a></div>
      {% endif %}
    </div>
    <div class="nav-links">
      <a href="{{ '/blog/' | relative_url }}">ブログ</a>
      <a href="#yt">動画</a>
      <a href="#cats">活動</a>
      <a class="discord-btn" href="https://discord.gg/6VSxT3Pwsr">Discord</a>
    </div>
  </div>
</header>

{{ content }}

<footer>© 2026 Pickies — 好きを、つかもう。</footer>

</div>
</body>
</html>
